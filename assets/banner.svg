<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090E"/>
      <stop offset="60%" stop-color="#0A111C"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse-ring {
      0% { r: 5px; opacity: 0.9; }
      100% { r: 18px; opacity: 0; }
    }
    @keyframes card-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes dash-travel {
      to { stroke-dashoffset: -40; }
    }
    @keyframes finger-move {
      0%, 100% { transform: translate(780px, 95px); }
      35% { transform: translate(960px, 140px); }
      70% { transform: translate(840px, 190px); }
    }
    .float1 { animation: card-float 4s ease-in-out infinite; }
    .float2 { animation: card-float 5s ease-in-out infinite reverse; }
    .travel-line { stroke-dasharray: 6 6; animation: dash-travel 1.5s linear infinite; }
    .cursor-hand { animation: finger-move 7s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .beacon { animation: pulse-ring 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; }
    .font-mono { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; }
  </style>

  <!-- Shell -->
  <rect x="10" y="10" width="1180" height="260" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="10" y="10" width="1180" height="260" rx="16" fill="url(#glowCyan)"/>
  <rect x="10" y="10" width="1180" height="260" rx="16" fill="url(#glowPurple)"/>

  <!-- Left Content -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#0E2F38" stroke="#0891B2" stroke-width="1"/>
    <circle cx="13" cy="13" r="3.5" fill="#06B6D4"/>
    <text x="24" y="17" fill="#67E8F9" font-size="11" font-weight="700" class="font-mono" letter-spacing="1.2">COMPUTER VISION</text>

    <text x="0" y="72" fill="#FFFFFF" font-size="44" class="font-title">Gesture<tspan fill="#38BDF8">Board</tspan></text>
    <text x="0" y="112" fill="#94A3B8" font-size="16" class="font-title">Real-Time Hand Gesture Spatial Canvas • 21-Point Landmark Tracking</text>

    <!-- Metrics Bar -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="125" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="19" fill="#E2E8F0" font-size="12" font-weight="700" class="font-mono">60 FPS CANVAS</text>

      <rect x="135" y="0" width="120" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="147" y="19" fill="#38BDF8" font-size="12" font-weight="700" class="font-mono">ZERO JITTER</text>

      <rect x="265" y="0" width="135" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="277" y="19" fill="#A78BFA" font-size="12" font-weight="700" class="font-mono">MEDIAPIPE AI</text>
    </g>
  </g>

  <!-- Right Interactive Spatial Diagram -->
  <g>
    <!-- Dynamic Connecting Bezier Curves -->
    <path d="M 760 110 Q 860 70 940 130" stroke="#0284C7" stroke-width="2" fill="none" class="travel-line"/>
    <path d="M 940 160 Q 890 220 810 200" stroke="#8B5CF6" stroke-width="2" fill="none" class="travel-line"/>

    <!-- Floating Node 1 -->
    <g class="float1" transform="translate(710, 75)">
      <rect width="130" height="65" rx="10" fill="url(#cardGrad)" stroke="#0284C7" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="5" fill="#38BDF8"/>
      <text x="32" y="26" fill="#F8FAFC" font-size="12" font-weight="700" class="font-title">Concept Node</text>
      <rect x="16" y="38" width="95" height="6" rx="3" fill="#334155"/>
      <rect x="16" y="48" width="60" height="6" rx="3" fill="#1E293B"/>
    </g>

    <!-- Floating Node 2 -->
    <g class="float2" transform="translate(930, 115)">
      <rect width="135" height="70" rx="10" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="5" fill="#A78BFA"/>
      <text x="32" y="26" fill="#F8FAFC" font-size="12" font-weight="700" class="font-title">Target Graph</text>
      <rect x="16" y="38" width="100" height="6" rx="3" fill="#334155"/>
      <rect x="16" y="50" width="75" height="6" rx="3" fill="#1E293B"/>
    </g>

    <!-- Animated Hand Gesture Cursor -->
    <g class="cursor-hand">
      <circle cx="0" cy="0" class="beacon" fill="#38BDF8"/>
      <circle cx="0" cy="0" r="5" fill="#38BDF8"/>
      <rect x="10" y="-12" width="78" height="22" rx="11" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
      <text x="20" y="3" fill="#E0F2FE" font-size="10" font-weight="700" class="font-mono">PINCH 89%</text>
    </g>
  </g>
</svg>